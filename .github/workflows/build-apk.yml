name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK, CMake, platform & build-tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Extract project
        run: |
          set -e
          if [ -f UltimateOdul-game-ui.zip ]; then
            ZIP=UltimateOdul-game-ui.zip
          elif [ -f UltimateOdul-fixed-build.zip ]; then
            ZIP=UltimateOdul-fixed-build.zip
          else
            echo "No UltimateOdul-*.zip found in repo root"
            ls -la
            exit 1
          fi
          echo "Using ZIP: $ZIP"
          unzip -o "$ZIP" -d project
          ls -la project/UltimateOdul/
          test -f project/UltimateOdul/app/src/main/cpp/decoy_verify.cpp

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Release APK
        working-directory: project/UltimateOdul
        run: gradle assembleRelease --stacktrace --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UltimateOdul-release-apk
          path: project/UltimateOdul/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
