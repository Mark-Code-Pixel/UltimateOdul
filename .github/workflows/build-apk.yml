name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Extract project ZIP
        run: |
          unzip -o UltimateOdul-odul-dictionary-v2.zip -d project
          ls -la project/UltimateOdul/

      - name: Create Gradle Wrapper
        working-directory: project/UltimateOdul
        run: |
          gradle wrapper --gradle-version 8.7 || true
          if [ ! -f gradlew ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build Release APK
        working-directory: project/UltimateOdul
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltimateOdul-release-apk
          path: project/UltimateOdul/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
