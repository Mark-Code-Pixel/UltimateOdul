name: Build Unsigned Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Install Android cmdline-tools (fallback)
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1" \
            || sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Unpack UnoReverse sources
        run: |
          set -e
          rm -rf project && mkdir project
          unzip -q UnoReverse-GitHub.zip -d project
          if [ -f project/settings.gradle ] || [ -f project/app/build.gradle ]; then
            echo "PROJECT_DIR=project" >> $GITHUB_ENV
          else
            TOP=$(find project -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) | head -1 | xargs dirname)
            echo "PROJECT_DIR=$TOP" >> $GITHUB_ENV
          fi
          ls -la "${PROJECT_DIR:-project}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: local.properties + wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.7 || true; fi
          chmod +x gradlew || true

      - name: Build unsigned release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -x ./gradlew ]; then ./gradlew :app:assembleRelease --stacktrace --no-daemon
          else gradle :app:assembleRelease --stacktrace --no-daemon; fi
          find app/build/outputs -name "*.apk" -print

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: uno-reverse-unsigned-apk
          path: |
            **/app/build/outputs/apk/release/*unsigned*.apk
            **/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
