name: Build Unsigned Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute
        run: chmod +x gradlew || true

      - name: Build unsigned release APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            gradle :app:assembleRelease --stacktrace
          fi
          # AGP may still emit app-release-unsigned.apk when no signingConfig
          find app/build/outputs -name "*.apk" -print

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: uno-reverse-unsigned-apk
          path: |
            app/build/outputs/apk/release/*unsigned*.apk
            app/build/outputs/apk/release/*.apk
