name: Build Unsigned Release APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK packages
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKM" ]; then
            mkdir -p $HOME/android-sdk/cmdline-tools
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -qo /tmp/cmdtools.zip -d $HOME/android-sdk/cmdline-tools
            mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
            ANDROID_HOME=$HOME/android-sdk
            echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
            SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          fi
          yes | "$SDKM" --sdk_root=$ANDROID_HOME --licenses >/dev/null || true
          "$SDKM" --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1" || true
      - name: Unpack project
        run: |
          set -e
          rm -rf project && mkdir project
          unzip -q UnoReverse-GitHub.zip -d project
          if [ -f project/settings.gradle ] || [ -f project/settings.gradle.kts ]; then
            PDIR=project
          else
            PDIR=$(find project -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) | head -1 | xargs -r dirname)
          fi
          echo "PROJECT_DIR=$PDIR" >> $GITHUB_ENV
          ls -la "$PDIR"
      - name: Install Gradle + wrapper
        run: |
          set -e
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -qo /tmp/gradle.zip -d $HOME
          echo "$HOME/gradle-8.7/bin" >> $GITHUB_PATH
          cd "$PROJECT_DIR"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          rm -f gradle/wrapper/gradle-wrapper.jar gradlew
          mkdir -p gradle/wrapper
          $HOME/gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          chmod +x gradlew
      - name: Build unsigned release
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleRelease --stacktrace --no-daemon
          find app/build/outputs -name "*.apk" -print
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: uno-reverse-unsigned-apk
          path: |
            **/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
